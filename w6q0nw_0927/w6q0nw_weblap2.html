    <title>Szövegformázás: Font (betűtipus, betűméret és szím)</title>
  </head>
  <body>
    <h3><b>Szövegformázás: Font (betűtipus, betűméret és szím)</b></h3>
    <br /><br />
    <p>
      Ebben a szövegben
      <font color="blue">lesznek</font>
      nagyobb betűk,
      <font size="1">kisebb betűk</font>
      illetve
      <font color="red">lesznek színes szövegrészek</font>
      is
    </p>
    <p>
      <font color="lightblue" size="5" face="Arial">123456789</font>
    </p>
    <p>
      <font color="lightblue" size="5" face="Arial">asd FGHjkl</font>
    </p>
