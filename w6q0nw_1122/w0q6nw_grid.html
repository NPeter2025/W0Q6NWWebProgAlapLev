<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid használata</title>

  <style>
    body {background-color: aqua;}

 
    * {
      box-sizing: border-box;
    }

    .wrapper{
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-auto-rows: 100px;
    }

    .wrapper{
    border: 2px solid red;
    border-radius: 5px;
    background-color: aliceblue;
    }

   .wrapper >div {
    border: 2px solid yellow; 
    border-radius: 5px;
    background-color: beige;
    padding:  1em;
    color: brown;
   }
  </style>

  </head>
  <body>

    <div class="wrapper">
      <div>Egy</div>
      <div>Kettő</div>
      <div>Három</div>
      <div>Négy</div>
      <div>Öt</div>
      <div>Hat</div>
    </div>

  </body>
</html>
