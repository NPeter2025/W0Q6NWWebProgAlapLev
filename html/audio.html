<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    Audio
    controls: megjeleníti az audio vezérlőket (play, pause, hangerő, stb.)
    source: megadja az audio fájl helyét
    autoplay: automatikusan elindítja az audio fájlt
    muted: némítja az audio fájlt
    loop: végtelenítve játssza az audio fájlt
    -->
    <p>On the flip </p>
    <audio controls autoplay muted loop>
        <source src="On The Flip - The Grey Room _ Density & Time (2).mp3" type="audio/mpeg"> 
    </audio>

    <p>Down the rabbit hole
    </p>
    <audio controls>
        <source src="Down The Rabbit Hole - The Grey Room _ Density & Time.mp3">
    </audio>

    <p>Resolution or Reflection</p>
    <audio controls>
        <source src="./Resolution Or Reflection - The Grey Room _ Clark Sims.mp3">
    </audio>
</body>
</html>
