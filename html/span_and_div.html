<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    <span> beágyazott elemeket jelöl, amelyek nem törik meg a szöveg folyamatosságát.
    <div> block szintű elemeket jelöl, amelyek új sort kezdenek és teljes szélességet foglalnak el.
    -->

    <h1> <span style="background-color: tomato;">This is a span title</span></h1>
    <h1><div style="background-color: tomato;">This is a div title</div></h1>

    <p><span>This is a span sentence</span></p>
    <p><div>This is a div sentence</div></p>

    <p>Lorem ipsum dolor sit, amet consectetur <span style="background-color: yellow;"> adipisicing elit. Iste, animi.</span></p>
    <p>Lorem ipsum dolor sit, amet consectetur <div style="background-color: yellow;"> adipisicing elit. Iste, animi.</div></p>
    
</body>
</html>
