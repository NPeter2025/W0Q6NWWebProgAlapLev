<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<!--
table: táblázatot hoz létre
tr: (table row) táblázat sorokat hoz létre
th: (table header) táblázat fejléc celláit hozza létre
td: (table data) táblázat adat celláit hozza létre 
border: a táblázat és cellák köré keretet rajzol
width: a cella szélességét állítja be
align: a cella tartalmának igazítását állítja be (left, center, right)
-->
<body>
    <h3>Store hours</h3>

    <table border="1" style="background-color: black;">
        <tr align="center">
            <th width="100" style="background-color: lightblue;">Sunday</th>
            <th width="100" style="background-color: lightblue;">Monday</th>
            <th width="100" style="background-color: lightblue;">Tuesday</th>
            <th width="100" style="background-color: lightblue;">Wednesday</th>
            <th width="100" style="background-color: lightblue;">Thursday</th>
            <th width="100" style="background-color: lightblue;">Friday</th>
            <th width="100" style="background-color: lightblue;">Saturday</th>
        </tr>
        <tr align="center" style="background-color: aliceblue;">
            <td>Closed</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>10-2</td>
        </tr>
    </table>
</body>
</html>
