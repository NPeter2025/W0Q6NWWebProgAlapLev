<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <p>This is normal</p>
    <p>This is <b>bold</b></p>
    <p>This is <i>italic</i></p>
    <p>This is <u>underlined</u></p>
    <p>This is <strong>strong</strong></p>
    <p>This is <em>emphasized</em></p>
    <p>This is <mark>highlighted</mark></p>
    <p>This is <del>deleted</del></p>
    <p>This is <big>big text</big></p>
    <p>This is <small>small text</small></p>
    <p>This is <sub>subscript</sub></p>
    <p>This is <sup>superscript</sup></p>
    <p>This is <tt>monospaced</tt></p>
</body>
</html>
